name: Update Best Factor Dashboard
run-name: >-
  Best Factor · ${{ github.event_name }} · control=${{ inputs.control_run_id || 'direct' }}

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Price history (keep preserves the saved setting)"
        required: true
        default: keep
        type: choice
        options: [keep, 2y, 5y, 10y]
      rebalance:
        description: "Portfolio rebalance frequency"
        required: true
        default: keep
        type: choice
        options: [keep, M, W]
      top_n:
        description: "Portfolio holding-count cap; blank keeps the saved setting"
        required: false
        default: ""
        type: string
      weighting:
        description: "Portfolio weighting method"
        required: true
        default: keep
        type: choice
        options: [keep, equal, score]
      factor_preset:
        description: "Factor library preset; allowlist still overrides it"
        required: true
        default: keep
        type: choice
        options: [keep, core, zoo]
      factor_allowlist:
        description: "Comma/space-separated factor names; blank=keep, __preset__=clear"
        required: false
        default: ""
        type: string
      min_market_cap:
        description: "Minimum market cap in USD; blank keeps the saved setting"
        required: false
        default: ""
        type: string
      min_dollar_volume:
        description: "Minimum average dollar volume; blank keeps the saved setting"
        required: false
        default: ""
        type: string
      eligibility_adv_window:
        description: "Trailing sessions for average dollar volume; blank=keep"
        required: false
        default: ""
        type: string
      transaction_cost_bps:
        description: "Transaction cost in basis points; blank keeps the saved setting"
        required: false
        default: ""
        type: string
      transaction_cost_model:
        description: "Transaction-cost calculation model"
        required: true
        default: keep
        type: choice
        options: [keep, one_way_notional, portfolio_turnover]
      allow_fallback:
        description: "Explicitly allow the liquidity-only fallback when market-cap metadata is insufficient"
        required: true
        default: false
        type: boolean
      control_run_id:
        description: "Optional control API run identifier for exact correlation; blank for direct/manual runs"
        required: false
        default: ""
        type: string
      control_input_schema_version:
        description: "Control API input schema version; required with control_run_id"
        required: false
        default: ""
        type: string
      control_input_schema_hash:
        description: "Control API input schema SHA-256; required with control_run_id"
        required: false
        default: ""
        type: string
      control_config_hash_algorithm:
        description: "Control API canonical configuration hash algorithm; required with control_run_id"
        required: false
        default: ""
        type: string
      control_config_hash:
        description: "Control API requested configuration hash; required with control_run_id"
        required: false
        default: ""
        type: string
  schedule:
    # 07:00 KST Tue-Sat: staggered primary refresh after the prior US regular session.
    - cron: "0 22 * * 1-5"
    # 09:00/11:00/13:00 KST Tue-Sat: 1-2 hour freshness-gated fallbacks.
    - cron: "0 0 * * 2-6"
    - cron: "0 2 * * 2-6"
    - cron: "0 4 * * 2-6"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/update-dashboard.yml"
      - ".github/best-factor-dashboard-config.json"
      - ".github/best-factor-dashboard-tickers.txt"
      - ".github/scripts/build_live_universe.py"
      - ".github/scripts/check_dashboard_freshness.py"
      - ".github/scripts/dashboard_config.py"
      - ".github/scripts/refresh_dashboard_tickers.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: best-factor-pages
  cancel-in-progress: false

jobs:
  deploy-committed-docs:
    if: >-
      github.repository == 'SonChangGi/best-factor' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !(github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, 'Skip-Pages-Deploy: update-dashboard-workflow'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout isolated best-factor repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install base analysis package
        run: python -m pip install -e .
      - name: Validate committed dashboard contracts
        run: |
          PYTHONPATH=src python -m unittest discover -s tests
          node --test tests/common_design_v1.test.mjs tests/control_api.test.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload committed dashboard artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs
      - name: Deploy committed dashboard to GitHub Pages
        id: deployment
        env:
          NODE_OPTIONS: --no-deprecation
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify live public dashboard bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            matched=true
            for relative_path in data/latest-results.json data/summary.json data/dashboard-config.json; do
              readback="/tmp/best-factor-${relative_path//\//-}"
              if ! curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --output "$readback" \
                "${PAGE_URL%/}/${relative_path}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
                || ! cmp --silent "docs/${relative_path}" "$readback"; then
                matched=false
                break
              fi
            done
            if [[ "$matched" == "true" ]]; then
              echo "Live Best Factor dashboard data is byte-identical to committed docs."
              exit 0
            fi
            [[ $attempt -lt 12 ]] || exit 1
            sleep 5
          done

  update-and-deploy:
    if: >-
      github.repository == 'SonChangGi/best-factor' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout isolated best-factor repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Record control run correlation
        env:
          CONTROL_RUN_ID: ${{ inputs.control_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CONTROL_RUN_ID}" && ! "${CONTROL_RUN_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9_.:-]{7,199}$ ]]; then
            echo "control_run_id has an invalid format." >&2
            exit 1
          fi
          echo "control correlation: control_run_id=${CONTROL_RUN_ID:-direct} github_run_id=${GITHUB_RUN_ID}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check KST dashboard freshness gate
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python .github/scripts/check_dashboard_freshness.py --event-name "$EVENT_NAME" --event-schedule "$EVENT_SCHEDULE"

      - name: Install package with live-data extra
        if: steps.freshness.outputs.should_update == 'true'
        run: python -m pip install -e '.[live]'

      - name: Run network-free regression tests
        if: steps.freshness.outputs.should_update == 'true'
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Run frontend control contract tests
        if: steps.freshness.outputs.should_update == 'true'
        run: node --test tests/common_design_v1.test.mjs tests/control_api.test.mjs

      - name: Run syntax/static import checks
        if: steps.freshness.outputs.should_update == 'true'
        run: PYTHONPATH=src python -m compileall -q src tests .github/scripts

      - name: Resolve and validate persisted analysis settings
        if: steps.freshness.outputs.should_update == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PERIOD: ${{ inputs.period }}
          INPUT_REBALANCE: ${{ inputs.rebalance }}
          INPUT_TOP_N: ${{ inputs.top_n }}
          INPUT_WEIGHTING: ${{ inputs.weighting }}
          INPUT_FACTOR_PRESET: ${{ inputs.factor_preset }}
          INPUT_FACTOR_ALLOWLIST: ${{ inputs.factor_allowlist }}
          INPUT_MIN_MARKET_CAP: ${{ inputs.min_market_cap }}
          INPUT_MIN_DOLLAR_VOLUME: ${{ inputs.min_dollar_volume }}
          INPUT_ELIGIBILITY_ADV_WINDOW: ${{ inputs.eligibility_adv_window }}
          INPUT_TRANSACTION_COST_BPS: ${{ inputs.transaction_cost_bps }}
          INPUT_TRANSACTION_COST_MODEL: ${{ inputs.transaction_cost_model }}
        run: |
          PYTHONPATH=src python .github/scripts/dashboard_config.py \
            --persisted .github/best-factor-dashboard-config.json \
            --event-name "${EVENT_NAME}" \
            --envelope-output /tmp/best-factor-effective-config.json \
            --values-output /tmp/best-factor-effective-config.values

      - name: Validate control API run binding
        if: steps.freshness.outputs.should_update == 'true' && inputs.control_run_id != ''
        env:
          CONTROL_RUN_ID: ${{ inputs.control_run_id }}
          CONTROL_INPUT_SCHEMA_VERSION: ${{ inputs.control_input_schema_version }}
          CONTROL_INPUT_SCHEMA_HASH: ${{ inputs.control_input_schema_hash }}
          CONTROL_CONFIG_HASH_ALGORITHM: ${{ inputs.control_config_hash_algorithm }}
          CONTROL_CONFIG_HASH: ${{ inputs.control_config_hash }}
          ALLOW_FALLBACK: ${{ inputs.allow_fallback }}
          CONTROL_ANALYSIS_PERIOD: ${{ inputs.period }}
          CONTROL_ANALYSIS_REBALANCE: ${{ inputs.rebalance }}
          CONTROL_ANALYSIS_TOP_N: ${{ inputs.top_n }}
          CONTROL_ANALYSIS_WEIGHTING: ${{ inputs.weighting }}
          CONTROL_ANALYSIS_FACTOR_PRESET: ${{ inputs.factor_preset }}
          CONTROL_ANALYSIS_FACTOR_ALLOWLIST: ${{ inputs.factor_allowlist }}
          CONTROL_ANALYSIS_MIN_MARKET_CAP: ${{ inputs.min_market_cap }}
          CONTROL_ANALYSIS_MIN_DOLLAR_VOLUME: ${{ inputs.min_dollar_volume }}
          CONTROL_ANALYSIS_ELIGIBILITY_ADV_WINDOW: ${{ inputs.eligibility_adv_window }}
          CONTROL_ANALYSIS_TRANSACTION_COST_BPS: ${{ inputs.transaction_cost_bps }}
          CONTROL_ANALYSIS_TRANSACTION_COST_MODEL: ${{ inputs.transaction_cost_model }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ALLOW_FALLBACK}" == "true" ]]; then
            echo "Control API runs must keep allow_fallback=false." >&2
            exit 1
          fi
          if [[ "${CONTROL_INPUT_SCHEMA_VERSION}" != "best-factor/v1" ]]; then
            echo "Control API input schema version mismatch." >&2
            exit 1
          fi
          if [[ ! "${CONTROL_INPUT_SCHEMA_HASH}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Control API input schema hash must be a lowercase SHA-256." >&2
            exit 1
          fi
          if [[ "${CONTROL_CONFIG_HASH_ALGORITHM}" != "best-factor-python-json-v1" ]]; then
            echo "Control API config hash algorithm mismatch." >&2
            exit 1
          fi
          if [[ ! "${CONTROL_CONFIG_HASH}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Control API config hash must be a lowercase SHA-256." >&2
            exit 1
          fi
          CONTROL_ANALYSIS_VALUES=(
            "${CONTROL_ANALYSIS_PERIOD}"
            "${CONTROL_ANALYSIS_REBALANCE}"
            "${CONTROL_ANALYSIS_TOP_N}"
            "${CONTROL_ANALYSIS_WEIGHTING}"
            "${CONTROL_ANALYSIS_FACTOR_PRESET}"
            "${CONTROL_ANALYSIS_FACTOR_ALLOWLIST}"
            "${CONTROL_ANALYSIS_MIN_MARKET_CAP}"
            "${CONTROL_ANALYSIS_MIN_DOLLAR_VOLUME}"
            "${CONTROL_ANALYSIS_ELIGIBILITY_ADV_WINDOW}"
            "${CONTROL_ANALYSIS_TRANSACTION_COST_BPS}"
            "${CONTROL_ANALYSIS_TRANSACTION_COST_MODEL}"
          )
          for value in "${CONTROL_ANALYSIS_VALUES[@]}"; do
            if [[ -z "${value}" || "${value}" == "keep" ]]; then
              echo "Control API dispatch must provide every analytical input explicitly." >&2
              exit 1
            fi
          done
          EFFECTIVE_CONFIG_HASH="$(python -c 'import json; print(json.load(open("/tmp/best-factor-effective-config.json", encoding="utf-8"))["config_hash"])')"
          if [[ "${EFFECTIVE_CONFIG_HASH}" != "${CONTROL_CONFIG_HASH}" ]]; then
            echo "Control API config hash does not match the effective 11-input configuration." >&2
            exit 1
          fi
          echo "control binding validated: control_run_id=${CONTROL_RUN_ID} input_schema_version=${CONTROL_INPUT_SCHEMA_VERSION} config_hash_algorithm=${CONTROL_CONFIG_HASH_ALGORITHM}"

      - name: Build validated Nasdaq Trader stock universe
        if: steps.freshness.outputs.should_update == 'true'
        shell: bash
        env:
          ALLOW_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_fallback }}
        run: |
          set -euo pipefail
          mapfile -d '' -t CONFIG_VALUES < /tmp/best-factor-effective-config.values
          if (( ${#CONFIG_VALUES[@]} != 11 )); then
            echo "Expected 11 normalized analysis settings, received ${#CONFIG_VALUES[@]}." >&2
            exit 1
          fi
          MIN_MARKET_CAP="${CONFIG_VALUES[6]}"
          MARKET_CAP_FALLBACK_ARGS=()
          if [[ "${ALLOW_FALLBACK}" == "true" ]]; then
            MARKET_CAP_FALLBACK_ARGS+=(--allow-incomplete-market-cap)
          fi
          python .github/scripts/build_live_universe.py \
            .github/best-factor-dashboard-tickers.txt \
            /tmp/best-factor-universe.csv \
            --metadata-json /tmp/best-factor-universe-metadata.json \
            --market-cap-metadata-json /tmp/best-factor-market-cap-metadata.json \
            --min-symbols 1700 \
            --min-market-cap "${MIN_MARKET_CAP}" \
            --min-market-cap-coverage-ratio 1.0 \
            "${MARKET_CAP_FALLBACK_ARGS[@]}"

      - name: Archive market-cap provider diagnostics
        if: always() && steps.freshness.outputs.should_update == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: best-factor-market-cap-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/best-factor-market-cap-metadata.json
            /tmp/best-factor-universe-metadata.json

      - name: Generate latest dashboard JSON
        if: steps.freshness.outputs.should_update == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_fallback }}
        run: |
          set -euo pipefail
          echo "fallback policy: event=${EVENT_NAME} allow_fallback=${ALLOW_FALLBACK}"
          mapfile -d '' -t CONFIG_VALUES < /tmp/best-factor-effective-config.values
          if (( ${#CONFIG_VALUES[@]} != 11 )); then
            echo "Expected 11 normalized analysis settings, received ${#CONFIG_VALUES[@]}." >&2
            exit 1
          fi
          PERIOD="${CONFIG_VALUES[0]}"
          REBALANCE="${CONFIG_VALUES[1]}"
          TOP_N="${CONFIG_VALUES[2]}"
          WEIGHTING="${CONFIG_VALUES[3]}"
          FACTOR_PRESET="${CONFIG_VALUES[4]}"
          FACTOR_ALLOWLIST="${CONFIG_VALUES[5]}"
          MIN_MARKET_CAP="${CONFIG_VALUES[6]}"
          MIN_DOLLAR_VOLUME="${CONFIG_VALUES[7]}"
          ELIGIBILITY_ADV_WINDOW="${CONFIG_VALUES[8]}"
          TRANSACTION_COST_BPS="${CONFIG_VALUES[9]}"
          TRANSACTION_COST_MODEL="${CONFIG_VALUES[10]}"
          MIN_MARKET_CAP_NAMES=20
          MIN_PRICE_TICKERS=1600
          MIN_PRICE_COVERAGE_RATIO=0.90
          MIN_LATEST_DATA_COVERAGE_RATIO=0.90
          MIN_FACTOR_ELIGIBLE_TICKERS=1100
          MIN_HISTORY_OBSERVATIONS=252
          PRICE_CHUNK_SIZE=100
          FACTOR_ARGS=(--factor-preset "${FACTOR_PRESET}")
          if [[ -n "${FACTOR_ALLOWLIST}" ]]; then
            IFS=',' read -r -a FACTOR_NAMES <<< "${FACTOR_ALLOWLIST}"
            FACTOR_ARGS+=(--factors "${FACTOR_NAMES[@]}")
          fi
          TICKERS=($(python - <<'PY'
          import csv
          with open("/tmp/best-factor-universe.csv", newline="", encoding="utf-8") as fh:
              print(" ".join(row["ticker"].upper() for row in csv.DictReader(fh) if row.get("ticker")))
          PY
          ))
          rm -rf /tmp/best-factor-live-run
          COMMON_ARGS=(
            --provider yfinance_yahoo_chart
            --tickers "${TICKERS[@]}"
            --period "${PERIOD}"
            --price-chunk-size "${PRICE_CHUNK_SIZE}"
            --min-price-tickers "${MIN_PRICE_TICKERS}"
            --min-price-coverage-ratio "${MIN_PRICE_COVERAGE_RATIO}"
            --min-latest-data-coverage-ratio "${MIN_LATEST_DATA_COVERAGE_RATIO}"
            --min-factor-eligible-tickers "${MIN_FACTOR_ELIGIBLE_TICKERS}"
            --min-history-observations "${MIN_HISTORY_OBSERVATIONS}"
            --eligibility-adv-window "${ELIGIBILITY_ADV_WINDOW}"
            --skip-factor-scores-csv
            --universe-metadata-file /tmp/best-factor-universe-metadata.json
            --output-dir /tmp/best-factor-live-run
            --rebalance "${REBALANCE}"
            --top-n "${TOP_N}"
            --weighting "${WEIGHTING}"
            "${FACTOR_ARGS[@]}"
            --benchmark-tickers '^IXIC' ONEQ QQQ
            --min-dollar-volume "${MIN_DOLLAR_VOLUME}"
            --transaction-cost-bps "${TRANSACTION_COST_BPS}"
            --transaction-cost-model "${TRANSACTION_COST_MODEL}"
            --universe-file /tmp/best-factor-universe.csv
          )
          export MIN_MARKET_CAP
          MARKET_CAP_ELIGIBLE_COUNT="$(python - <<'PY'
          import csv
          import math
          import os

          threshold = float(os.environ["MIN_MARKET_CAP"])
          count = 0
          with open("/tmp/best-factor-universe.csv", newline="", encoding="utf-8") as fh:
              for row in csv.DictReader(fh):
                  try:
                      market_cap = float(row.get("market_cap") or "nan")
                  except ValueError:
                      continue
                  if math.isfinite(market_cap) and market_cap >= threshold:
                      count += 1
          print(count)
          PY
          )"
          echo "market-cap eligible names: ${MARKET_CAP_ELIGIBLE_COUNT}/${#TICKERS[@]}"
          if [[ "${MIN_MARKET_CAP}" == "0.0" ]]; then
            DATA_SCOPE=live_resilient_current_common_stock_liquidity_screen_actions
            python -m best_factor.cli run "${COMMON_ARGS[@]}"
          elif (( MARKET_CAP_ELIGIBLE_COUNT >= MIN_MARKET_CAP_NAMES )); then
            DATA_SCOPE=live_resilient_current_market_cap_and_liquidity_screen_actions
            python -m best_factor.cli run "${COMMON_ARGS[@]}" --min-market-cap "${MIN_MARKET_CAP}"
          else
            if [[ "${ALLOW_FALLBACK}" != "true" ]]; then
              echo "Market-cap metadata preflight found only ${MARKET_CAP_ELIGIBLE_COUNT} eligible names; fallback is disabled, so no result will be published." >&2
              exit 1
            fi
            DATA_SCOPE=live_resilient_current_common_stock_liquidity_screen_actions
            echo "Market-cap metadata preflight found only ${MARKET_CAP_ELIGIBLE_COUNT} eligible names; explicitly allowed liquidity-only fallback is running." >&2
            rm -rf /tmp/best-factor-live-run
            python -m best_factor.cli run "${COMMON_ARGS[@]}" \
              --market-cap-filter-attempted \
              --filter-fallback-reason market_cap_metadata_insufficient_preflight
          fi
          python -m best_factor.cli site \
            --run-dir /tmp/best-factor-live-run \
            --output-file docs/data/latest-results.json \
            --data-scope "${DATA_SCOPE}"
          PYTHONPATH=src python .github/scripts/dashboard_config.py \
            --mode publish \
            --persisted /tmp/best-factor-effective-config.json \
            --result-file docs/data/latest-results.json \
            --public-output docs/data/dashboard-config.json
          cp /tmp/best-factor-effective-config.json .github/best-factor-dashboard-config.json

      - name: Validate generated publication contracts
        if: steps.freshness.outputs.should_update == 'true'
        run: |
          PYTHONPATH=src python .github/scripts/validate_publication.py
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_docs_site.py'
          node --test tests/common_design_v1.test.mjs tests/control_api.test.mjs

      - name: Commit refreshed dashboard data
        if: steps.freshness.outputs.should_update == 'true'
        id: data_commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/data/latest-results.json docs/data/summary.json docs/data/dashboard-config.json .github/best-factor-dashboard-config.json; then
            echo "No dashboard data or analysis-setting changes to commit."
            echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest-results.json docs/data/summary.json docs/data/dashboard-config.json .github/best-factor-dashboard-config.json
          cat > /tmp/best-factor-refresh-commit.txt <<'MSG'
          Keep Best Factor public data synchronized

          Constraint: scheduled live-data refresh must preserve static GitHub Pages and generated JSON contracts
          Rejected: artifact-only deploy | later source pushes could redeploy stale committed docs over fresh Pages output
          Confidence: high
          Scope-risk: narrow
          Directive: do not edit analysis methodology in automation-only refresh commits
          Tested: workflow freshness gate, network-free regression tests, and post-generation publication contracts run before this commit
          Not-tested: live provider availability beyond this scheduled run

          Skip-Pages-Deploy: update-dashboard-workflow
          MSG
          git commit -F /tmp/best-factor-refresh-commit.txt
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Archive generated run artifacts
        if: steps.freshness.outputs.should_update == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: best-factor-live-run-${{ github.run_id }}
          if-no-files-found: error
          path: |
            /tmp/best-factor-live-run/*.csv
            /tmp/best-factor-live-run/*.json
            /tmp/best-factor-live-run/report.md
            /tmp/best-factor-live-run/report.html
            /tmp/best-factor-market-cap-metadata.json
            /tmp/best-factor-universe-metadata.json
            docs/data/latest-results.json
            docs/data/summary.json
            docs/data/dashboard-config.json
            .github/best-factor-dashboard-config.json

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.should_update == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload static dashboard artifact
        if: steps.freshness.outputs.should_update == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.should_update == 'true'
        id: deployment
        env:
          NODE_OPTIONS: --no-deprecation
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Verify live public dashboard bytes
        if: steps.freshness.outputs.should_update == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            matched=true
            for relative_path in data/latest-results.json data/summary.json data/dashboard-config.json; do
              readback="/tmp/best-factor-${relative_path//\//-}"
              if ! curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --output "$readback" \
                "${PAGE_URL%/}/${relative_path}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
                || ! cmp --silent "docs/${relative_path}" "$readback"; then
                matched=false
                break
              fi
            done
            if [[ "$matched" == "true" ]]; then
              echo "Live Best Factor dashboard data is byte-identical to generated docs."
              exit 0
            fi
            [[ $attempt -lt 12 ]] || exit 1
            sleep 5
          done

      - name: Verify immutable control-run artifact
        if: steps.freshness.outputs.should_update == 'true' && inputs.control_run_id != ''
        id: control_readback
        env:
          DATA_COMMIT_SHA: ${{ steps.data_commit.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${DATA_COMMIT_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Data commit SHA is missing or invalid." >&2
            exit 1
          fi
          PUBLIC_RESULT_URL="https://raw.githubusercontent.com/SonChangGi/best-factor/${DATA_COMMIT_SHA}/docs/data/latest-results.json"
          MATCHED=false
          for attempt in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --output /tmp/best-factor-public-latest-results.json \
              "${PUBLIC_RESULT_URL}" \
              && cmp --silent docs/data/latest-results.json /tmp/best-factor-public-latest-results.json; then
              MATCHED=true
              break
            fi
            echo "immutable result readback is not byte-identical yet (attempt ${attempt}/12)"
            sleep 5
          done
          if [[ "${MATCHED}" != "true" ]]; then
            echo "Immutable committed latest-results.json did not become byte-identical to the generated artifact." >&2
            exit 1
          fi
          echo "artifact_url=${PUBLIC_RESULT_URL}" >> "${GITHUB_OUTPUT}"
          echo "immutable control artifact readback verified"

      - name: Publish control-run result manifest
        if: steps.freshness.outputs.should_update == 'true' && inputs.control_run_id != ''
        env:
          CONTROL_RUN_ID: ${{ inputs.control_run_id }}
          CONTROL_INPUT_SCHEMA_VERSION: ${{ inputs.control_input_schema_version }}
          CONTROL_INPUT_SCHEMA_HASH: ${{ inputs.control_input_schema_hash }}
          CONTROL_CONFIG_HASH_ALGORITHM: ${{ inputs.control_config_hash_algorithm }}
          CONTROL_CONFIG_HASH: ${{ inputs.control_config_hash }}
          ARTIFACT_URL: ${{ steps.control_readback.outputs.artifact_url }}
          CODE_VERSION: ${{ github.sha }}
          QUANT_CONTROL_CALLBACK_URL: ${{ secrets.QUANT_CONTROL_CALLBACK_URL }}
          QUANT_CONTROL_WORKER_CALLBACK_TOKEN: ${{ secrets.QUANT_CONTROL_WORKER_CALLBACK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${QUANT_CONTROL_CALLBACK_URL}" || -z "${QUANT_CONTROL_WORKER_CALLBACK_TOKEN}" ]]; then
            echo "Control callback secrets are required for a control_run_id execution." >&2
            exit 1
          fi
          if [[ ! "${QUANT_CONTROL_CALLBACK_URL}" =~ ^https:// ]]; then
            echo "Control callback URL must use HTTPS." >&2
            exit 1
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          callback_base = urlsplit(os.environ["QUANT_CONTROL_CALLBACK_URL"])
          if (
              callback_base.scheme != "https"
              or not callback_base.hostname
              or callback_base.username
              or callback_base.password
              or callback_base.query
              or callback_base.fragment
          ):
              raise SystemExit("Control callback URL must be an HTTPS base without credentials, query, or fragment")
          result_path = Path("/tmp/best-factor-public-latest-results.json")
          result_bytes = result_path.read_bytes()
          payload = json.loads(result_bytes)
          config_envelope = json.loads(Path("/tmp/best-factor-effective-config.json").read_text(encoding="utf-8"))
          summary = payload.get("summary")
          metadata = payload.get("metadata")
          if not isinstance(summary, dict):
              raise SystemExit("latest-results summary must be an object")
          if not isinstance(metadata, dict):
              metadata = {}
          summary_allowlist = (
              "best_composite_score",
              "best_factor",
              "best_factor_holdout_cagr",
              "best_factor_holdout_rank",
              "best_factor_holdout_sharpe",
              "data_end_date",
              "effective_factor_count",
              "factor_library_size",
              "factor_preset",
              "fetched_at",
              "holding_count",
              "interpretation_label",
              "provider",
              "ranking_count",
              "selected_factor_count",
              "source_hash",
              "tested_factor_count",
              "universe_as_of_date",
          )
          bounded_payload = {
              "schema_version": payload.get("schema_version"),
              "generated_at": payload.get("generated_at"),
              "summary": {
                  key: summary[key]
                  for key in summary_allowlist
                  if key in summary
              },
          }
          bounded_bytes = json.dumps(
              bounded_payload,
              ensure_ascii=False,
              allow_nan=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("utf-8")
          if len(bounded_bytes) > 64 * 1024:
              raise SystemExit("Best Factor control summary exceeds 64 KiB")
          source = payload.get("data_scope")
          source_hash = summary.get("source_hash") or metadata.get("source_hash")
          data_as_of = summary.get("data_end_date") or metadata.get("data_end_date")
          calculated_at = payload.get("generated_at")
          if not isinstance(source, str) or not source:
              raise SystemExit("latest-results data_scope is required")
          if not isinstance(source_hash, str) or not (8 <= len(source_hash) <= 128) or any(
              char not in "0123456789abcdefABCDEF" for char in source_hash
          ):
              raise SystemExit("latest-results source hash must be an 8-128 character hexadecimal digest")
          if not isinstance(data_as_of, str) or not data_as_of:
              raise SystemExit("latest-results data end date is required")
          if not isinstance(calculated_at, str) or not calculated_at:
              raise SystemExit("latest-results generated_at is required")
          effective_config_hash = config_envelope.get("config_hash")
          if effective_config_hash != os.environ["CONTROL_CONFIG_HASH"]:
              raise SystemExit("effective config hash drifted after control binding validation")
          manifest = {
              "binding": {
                  "projectId": "best-factor",
                  "runId": os.environ["CONTROL_RUN_ID"],
                  "inputSchemaVersion": os.environ["CONTROL_INPUT_SCHEMA_VERSION"],
                  "inputSchemaHash": os.environ["CONTROL_INPUT_SCHEMA_HASH"],
                  "configHashAlgorithm": os.environ["CONTROL_CONFIG_HASH_ALGORITHM"],
                  "configHash": os.environ["CONTROL_CONFIG_HASH"],
              },
              "requestedInputs": config_envelope["config"],
              "normalizedInputs": config_envelope["config"],
              "effectiveConfigHash": effective_config_hash,
              "effectiveInputs": config_envelope["config"],
              "ignoredInputs": [],
              "fallbacks": [],
              "fallbackUsed": False,
              "fallbackReason": None,
              "dataAsOf": data_as_of,
              "calculatedAt": calculated_at,
              "codeVersion": os.environ["CODE_VERSION"],
              "dataIdentity": {
                  "source": source,
                  "sourceHash": source_hash,
                  "dataAsOf": data_as_of,
              },
              "artifact": {
                  "url": os.environ["ARTIFACT_URL"],
                  "sha256": hashlib.sha256(result_bytes).hexdigest(),
                  "byteSize": len(result_bytes),
                  "contractVersion": "best-factor/latest-results/v1",
              },
              "payload": bounded_payload,
          }
          Path("/tmp/best-factor-control-result-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          CALLBACK_ENDPOINT="${QUANT_CONTROL_CALLBACK_URL%/}/v1/internal/runs/${CONTROL_RUN_ID}/result-manifest"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${QUANT_CONTROL_WORKER_CALLBACK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/best-factor-control-result-manifest.json \
            --output /tmp/best-factor-control-callback-response.txt \
            "${CALLBACK_ENDPOINT}"
          echo "control result manifest accepted"

      - name: Report controlled-run failure
        if: ${{ always() && failure() && inputs.control_run_id != '' }}
        continue-on-error: true
        env:
          CONTROL_RUN_ID: ${{ inputs.control_run_id }}
          CONTROL_INPUT_SCHEMA_VERSION: ${{ inputs.control_input_schema_version }}
          CONTROL_INPUT_SCHEMA_HASH: ${{ inputs.control_input_schema_hash }}
          CONTROL_CONFIG_HASH_ALGORITHM: ${{ inputs.control_config_hash_algorithm }}
          CONTROL_CONFIG_HASH: ${{ inputs.control_config_hash }}
          QUANT_CONTROL_CALLBACK_URL: ${{ secrets.QUANT_CONTROL_CALLBACK_URL }}
          QUANT_CONTROL_WORKER_CALLBACK_TOKEN: ${{ secrets.QUANT_CONTROL_WORKER_CALLBACK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${QUANT_CONTROL_CALLBACK_URL}" || -z "${QUANT_CONTROL_WORKER_CALLBACK_TOKEN}" ]]; then
            echo "Control callback secrets are unavailable; the API timeout reaper will close this run." >&2
            exit 1
          fi
          if [[ ! "${QUANT_CONTROL_CALLBACK_URL}" =~ ^https:// ]]; then
            echo "Control callback URL must use HTTPS." >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit

          callback_base = urlsplit(os.environ["QUANT_CONTROL_CALLBACK_URL"])
          if (
              callback_base.scheme != "https"
              or not callback_base.hostname
              or callback_base.username
              or callback_base.password
              or callback_base.query
              or callback_base.fragment
          ):
              raise SystemExit("Control callback URL must be an HTTPS base without credentials, query, or fragment")
          payload = {
              "binding": {
                  "projectId": "best-factor",
                  "runId": os.environ["CONTROL_RUN_ID"],
                  "inputSchemaVersion": os.environ["CONTROL_INPUT_SCHEMA_VERSION"],
                  "inputSchemaHash": os.environ["CONTROL_INPUT_SCHEMA_HASH"],
                  "configHashAlgorithm": os.environ["CONTROL_CONFIG_HASH_ALGORITHM"],
                  "configHash": os.environ["CONTROL_CONFIG_HASH"],
              },
              "errorCode": "worker_workflow_failed",
              "errorMessage": "Best Factor controlled GitHub Actions job failed before a verified result was published.",
              "providerRunId": f"github-actions:{os.environ['CONTROL_RUN_ID']}",
              "occurredAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          Path("/tmp/best-factor-control-failure.json").write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          CALLBACK_ENDPOINT="${QUANT_CONTROL_CALLBACK_URL%/}/v1/internal/runs/${CONTROL_RUN_ID}/failure"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${QUANT_CONTROL_WORKER_CALLBACK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/best-factor-control-failure.json \
            --output /tmp/best-factor-control-failure-response.txt \
            "${CALLBACK_ENDPOINT}"
          echo "control failure manifest accepted"
