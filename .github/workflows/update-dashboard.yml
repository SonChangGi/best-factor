name: Update Best Factor Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/update-dashboard.yml"
      - ".github/best-factor-dashboard-tickers.txt"
      - ".github/scripts/build_live_universe.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: best-factor-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    if: github.repository == 'SonChangGi/best-factor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout isolated best-factor repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with live-data extra
        run: python -m pip install -e '.[live]'

      - name: Run network-free regression tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Build live yfinance universe metadata
        run: python .github/scripts/build_live_universe.py .github/best-factor-dashboard-tickers.txt /tmp/best-factor-universe.csv

      - name: Generate latest dashboard JSON
        shell: bash
        run: |
          set -euo pipefail
          TICKERS=($(grep -Ev '^[[:space:]]*(#|$)' .github/best-factor-dashboard-tickers.txt | tr '[:lower:]' '[:upper:]'))
          rm -rf /tmp/best-factor-live-run
          COMMON_ARGS=(
            --provider yfinance
            --tickers "${TICKERS[@]}"
            --period 5y
            --output-dir /tmp/best-factor-live-run
            --rebalance M
            --top-n 10
            --weighting score
            --min-dollar-volume 50000000
            --transaction-cost-bps 5
            --universe-file /tmp/best-factor-universe.csv
          )
          if ! python -m best_factor.cli run "${COMMON_ARGS[@]}" --min-market-cap 10000000000; then
            echo "Market-cap metadata filter was not usable for enough names; retrying with liquidity filter only." >&2
            rm -rf /tmp/best-factor-live-run
            python -m best_factor.cli run "${COMMON_ARGS[@]}"
          fi
          python -m best_factor.cli site \
            --run-dir /tmp/best-factor-live-run \
            --output-file docs/data/latest-results.json \
            --data-scope live_yfinance_curated_us_large_liquid_actions

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static dashboard artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
