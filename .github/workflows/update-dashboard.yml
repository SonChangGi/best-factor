name: Update Best Factor Dashboard

on:
  workflow_dispatch:
    # Manual dispatch remains available for reviewed reruns.
  schedule:
    # 07:00 KST Tue-Sat: staggered primary refresh after the prior US regular session.
    - cron: "0 22 * * 1-5"
    # 09:00/11:00/13:00 KST Tue-Sat: 1-2 hour freshness-gated fallbacks.
    - cron: "0 0 * * 2-6"
    - cron: "0 2 * * 2-6"
    - cron: "0 4 * * 2-6"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/update-dashboard.yml"
      - ".github/best-factor-dashboard-tickers.txt"
      - ".github/scripts/build_live_universe.py"
      - ".github/scripts/check_dashboard_freshness.py"
      - ".github/scripts/refresh_dashboard_tickers.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: best-factor-pages
  cancel-in-progress: false

jobs:
  deploy-committed-docs:
    if: >-
      github.repository == 'SonChangGi/best-factor' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !(github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, 'Skip-Pages-Deploy: update-dashboard-workflow'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout isolated best-factor repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload committed dashboard artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs
      - name: Deploy committed dashboard to GitHub Pages
        id: deployment
        env:
          NODE_OPTIONS: --no-deprecation
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  update-and-deploy:
    if: >-
      github.repository == 'SonChangGi/best-factor' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout isolated best-factor repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check KST dashboard freshness gate
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python .github/scripts/check_dashboard_freshness.py --event-name "$EVENT_NAME" --event-schedule "$EVENT_SCHEDULE"

      - name: Install package with live-data extra
        if: steps.freshness.outputs.should_update == 'true'
        run: python -m pip install -e '.[live]'

      - name: Run network-free regression tests
        if: steps.freshness.outputs.should_update == 'true'
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Run syntax/static import checks
        if: steps.freshness.outputs.should_update == 'true'
        run: PYTHONPATH=src python -m compileall -q src tests .github/scripts

      - name: Build validated Nasdaq Trader stock universe
        if: steps.freshness.outputs.should_update == 'true'
        run: python .github/scripts/build_live_universe.py .github/best-factor-dashboard-tickers.txt /tmp/best-factor-universe.csv --metadata-json /tmp/best-factor-universe-metadata.json --min-symbols 1700

      - name: Generate latest dashboard JSON
        if: steps.freshness.outputs.should_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TOP_N=20
          MIN_MARKET_CAP=10000000000
          MIN_MARKET_CAP_NAMES=20
          MIN_PRICE_TICKERS=1600
          MIN_PRICE_COVERAGE_RATIO=0.90
          MIN_LATEST_DATA_COVERAGE_RATIO=0.90
          MIN_FACTOR_ELIGIBLE_TICKERS=1100
          MIN_HISTORY_OBSERVATIONS=252
          ELIGIBILITY_ADV_WINDOW=63
          PRICE_CHUNK_SIZE=100
          TICKERS=($(python - <<'PY'
          import csv
          with open("/tmp/best-factor-universe.csv", newline="", encoding="utf-8") as fh:
              print(" ".join(row["ticker"].upper() for row in csv.DictReader(fh) if row.get("ticker")))
          PY
          ))
          rm -rf /tmp/best-factor-live-run
          COMMON_ARGS=(
            --provider yfinance_yahoo_chart
            --tickers "${TICKERS[@]}"
            --period 5y
            --price-chunk-size "${PRICE_CHUNK_SIZE}"
            --min-price-tickers "${MIN_PRICE_TICKERS}"
            --min-price-coverage-ratio "${MIN_PRICE_COVERAGE_RATIO}"
            --min-latest-data-coverage-ratio "${MIN_LATEST_DATA_COVERAGE_RATIO}"
            --min-factor-eligible-tickers "${MIN_FACTOR_ELIGIBLE_TICKERS}"
            --min-history-observations "${MIN_HISTORY_OBSERVATIONS}"
            --eligibility-adv-window "${ELIGIBILITY_ADV_WINDOW}"
            --skip-factor-scores-csv
            --universe-metadata-file /tmp/best-factor-universe-metadata.json
            --output-dir /tmp/best-factor-live-run
            --rebalance M
            --top-n "${TOP_N}"
            --weighting score
            --factor-preset zoo
            --benchmark-tickers '^IXIC' ONEQ QQQ
            --min-dollar-volume 50000000
            --transaction-cost-bps 5
            --transaction-cost-model one_way_notional
            --universe-file /tmp/best-factor-universe.csv
          )
          export MIN_MARKET_CAP
          MARKET_CAP_ELIGIBLE_COUNT="$(python - <<'PY'
          import csv
          import math
          import os

          threshold = float(os.environ["MIN_MARKET_CAP"])
          count = 0
          with open("/tmp/best-factor-universe.csv", newline="", encoding="utf-8") as fh:
              for row in csv.DictReader(fh):
                  try:
                      market_cap = float(row.get("market_cap") or "nan")
                  except ValueError:
                      continue
                  if math.isfinite(market_cap) and market_cap >= threshold:
                      count += 1
          print(count)
          PY
          )"
          echo "market-cap eligible names: ${MARKET_CAP_ELIGIBLE_COUNT}/${#TICKERS[@]}"
          if (( MARKET_CAP_ELIGIBLE_COUNT >= MIN_MARKET_CAP_NAMES )); then
            DATA_SCOPE=live_resilient_current_market_cap_and_liquidity_screen_actions
            python -m best_factor.cli run "${COMMON_ARGS[@]}" --min-market-cap "${MIN_MARKET_CAP}"
          else
            DATA_SCOPE=live_resilient_current_common_stock_liquidity_screen_actions
            echo "Market-cap metadata preflight found only ${MARKET_CAP_ELIGIBLE_COUNT} eligible names; running liquidity-only fallback." >&2
            rm -rf /tmp/best-factor-live-run
            python -m best_factor.cli run "${COMMON_ARGS[@]}" \
              --market-cap-filter-attempted \
              --filter-fallback-reason market_cap_metadata_insufficient_preflight
          fi
          python -m best_factor.cli site \
            --run-dir /tmp/best-factor-live-run \
            --output-file docs/data/latest-results.json \
            --data-scope "${DATA_SCOPE}"

      - name: Commit refreshed dashboard data
        if: steps.freshness.outputs.should_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/data/latest-results.json docs/data/summary.json; then
            echo "No dashboard data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest-results.json docs/data/summary.json
          cat > /tmp/best-factor-refresh-commit.txt <<'MSG'
          Keep Best Factor public data synchronized

          Constraint: scheduled live-data refresh must preserve static GitHub Pages and generated JSON contracts
          Rejected: artifact-only deploy | later source pushes could redeploy stale committed docs over fresh Pages output
          Confidence: high
          Scope-risk: narrow
          Directive: do not edit analysis methodology in automation-only refresh commits
          Tested: workflow freshness gate and network-free regression tests run before this commit
          Not-tested: live provider availability beyond this scheduled run

          Skip-Pages-Deploy: update-dashboard-workflow
          MSG
          git commit -F /tmp/best-factor-refresh-commit.txt
          git push origin HEAD:main

      - name: Archive generated run artifacts
        if: steps.freshness.outputs.should_update == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: best-factor-live-run-${{ github.run_id }}
          if-no-files-found: error
          path: |
            /tmp/best-factor-live-run/*.csv
            /tmp/best-factor-live-run/*.json
            /tmp/best-factor-live-run/report.md
            /tmp/best-factor-live-run/report.html
            /tmp/best-factor-universe-metadata.json
            docs/data/latest-results.json
            docs/data/summary.json

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.should_update == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload static dashboard artifact
        if: steps.freshness.outputs.should_update == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.should_update == 'true'
        id: deployment
        env:
          NODE_OPTIONS: --no-deprecation
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
