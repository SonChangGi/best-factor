[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "best-factor"
version = "0.1.0"
description = "CLI factor backtester for ranking US equity factors with free-data caveats"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "best-factor"}]
dependencies = []

[project.optional-dependencies]
live = ["yfinance==1.4.1"]
test = []

[project.scripts]
best-factor = "best_factor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
